# Build the Pose2Sim desktop GUI (PyInstaller) on Windows + macOS
# and publish the installers to GitHub Releases on every push to main.
name: GUI release build

on:
  push:
    branches: ["main"]
    paths:
      - "GUI/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/gui-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gui-release
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win
          - os: macos-latest
            artifact: mac

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Install Pose2Sim + PyInstaller
        run: uv pip install --system -e .[gui] pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/pose2sim.spec --noconfirm --clean
        shell: bash

      - name: Build Windows installer (Inno Setup)
        if: matrix.artifact == 'win'
        shell: powershell
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows_installer.iss
          Compress-Archive -Path dist\Pose2Sim\* -DestinationPath dist\Pose2Sim-win64.zip

      - name: Build macOS disk image
        if: matrix.artifact == 'mac'
        shell: bash
        run: |
          hdiutil create -volname Pose2Sim -srcfolder dist/Pose2Sim.app \
            -ov -format UDZO dist/Pose2Sim-macOS.dmg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pose2Sim-${{ matrix.artifact }}
          path: |
            dist/Pose2Sim-win64.zip
            dist-installer/Pose2Sim-Setup-*.exe
            dist/Pose2Sim-macOS.dmg

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List files to publish
        run: ls -R release-files
        shell: bash

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gui-v0.1.${{ github.run_number }}
          name: Pose2Sim GUI v0.1.${{ github.run_number }}
          body: |
            ## 📦 Pose2Sim GUI v0.1.${{ github.run_number }}

            **EN** · [فارسی ↓](#-نسخهی-فارسی)

            ### ⬇️ Download

            | File | For |
            |---|---|
            | `Pose2Sim-Setup-*.exe` | 🪟 Windows 10/11 — recommended installer |
            | `Pose2Sim-win64.zip` | 🪟 Windows portable, no install needed |
            | `Pose2Sim-macOS.dmg` | 🍎 macOS (Apple Silicon) |

            ### 🪟 Install on Windows

            1. Download and run `Pose2Sim-Setup-*.exe`.
            2. If SmartScreen warns (builds are not code-signed yet), click **More info → Run anyway**.
            3. Pick your project folder, tick the pipeline steps, press **Run**.

            ### 🍎 Install on macOS

            1. Open `Pose2Sim-macOS.dmg` and drag **Pose2Sim** into Applications.
            2. First launch: right-click → **Open** (unsigned build), then confirm.

            ### ℹ️ Notes

            - Automatic build from `main` (`${{ github.sha }}`) — pre-release, may have rough edges.
            - Full pipeline included: calibration → pose estimation → sync → triangulation → filtering → OpenSim kinematics.
            - Everything runs locally on your machine — no account, no cloud.
            - Found a bug? [Open an issue](https://github.com/0xzare/pose2sim/issues) and paste the log text.

            ---
            ### 🇮🇷 نسخه‌ی فارسی

            ### ⬇️ دانلود

            | فایل | برای |
            |---|---|
            | `Pose2Sim-Setup-*.exe` | 🪟 ویندوز ۱۰/۱۱ — نصب پیشنهادی |
            | `Pose2Sim-win64.zip` | 🪟 ویندوز پرتابل، بدون نصب |
            | `Pose2Sim-macOS.dmg` | 🍎 مک (اپل سیلیکون) |

            ### 🪟 نصب روی ویندوز

            1. فایل ستاپ رو دانلود و اجرا کن.
            2. اگه اسمارت‌اسکرین گیر داد (بیلدها امضا ندارن)، **More info ← Run anyway**.
            3. پوشه‌ی پروژه رو بده، مرحله‌ها رو تیک بزن، **اجرا** رو بزن.

            ### 🍎 نصب روی مک

            1. dmg رو باز کن و Pose2Sim رو بنداز توی Applications.
            2. بار اول: راست‌کلیک ← **Open**، بعد تأیید کن.

            باگ دیدی؟ [ایشو باز کن](https://github.com/0xzare/pose2sim/issues) و متن لاگ رو بفرست.
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            release-files/**/*.zip
            release-files/**/*.exe
            release-files/**/*.dmg
